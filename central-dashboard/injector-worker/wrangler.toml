# Journey HTML-injector Worker.
# Deploy ONCE, then attach as a Custom Route on each Cloudflare zone you want to
# measure (across BOTH accounts). It stamps the User Journey tracking snippet onto
# every HTML response at the edge - no origin / source edits needed.

name = "journey-injector"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Public URL of the central backend Worker's tracking ingest endpoint.
# REQUIRED - if left empty the Worker passes traffic through untouched (no inject).
# Example: "https://central-analytics-api.<your-sub>.workers.dev/api/track"
TRACK_ENDPOINT = ""
